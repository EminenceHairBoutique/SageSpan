# Minimal Supabase CLI configuration for local development and `supabase test db`.
# Generated by hand for this repository; adjust ports if they collide locally.
project_id = "sagespan-local"

[api]
enabled = true
port = 54321
schemas = ["public", "app"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# The e-mail/password PROVIDER must be on for password sign-in (PR-003b, realstack harness).
# Self-service sign-up remains off through [auth] enable_signup = false above; accounts are
# created by an administrator. (`enable_signup` here used to mean "provider enabled" and is
# deprecated in favour of `enabled`.)
enabled = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "2MiB"

[realtime]
enabled = false

[analytics]
enabled = false
