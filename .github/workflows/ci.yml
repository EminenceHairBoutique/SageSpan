name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  calculator:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/calculator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Reproducible environment: services/calculator/uv.lock pins every package (Pydantic, FastAPI, ...).
      - run: pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run python -m pytest -q
      # Generated artefacts must match the locked environment and the fixtures.
      - run: uv run python scripts/export_rule_sets_sql.py --check
      - run: uv run python scripts/export_canonical_sql_test.py --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspace apps/web

  database:
    # Applies supabase/migrations and runs supabase/tests/*.test.sql on a real
    # Postgres using the Supabase/pgTAP shims (no Docker-in-Docker needed).
    # The major version matches supabase/config.toml (db.major_version = 15).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        # Throwaway CI database: trust auth on the loopback service, so no password exists anywhere.
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: python supabase/tests/run_sql_tests.py
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: postgres

  e2e:
    # Playwright scenarios against the real calculation service and the Next
    # dev server (both started by apps/web/playwright.config.ts webServer).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Calculation service venv from uv.lock (playwright.config.ts expects services/calculator/.venv)
        run: pip install uv && uv sync --locked --project services/calculator
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace apps/web
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  realstack:
    # PR-003c: the REAL Supabase stack (GoTrue, PostgREST, RLS, real pgTAP) via the Supabase CLI
    # and Docker on the runner. Two kinds of evidence the shimmed `database` job cannot give:
    #   1. `supabase test db` runs supabase/tests/*.test.sql with the genuine pgTAP extension
    #      (plan counts enforced, real auth.users).
    #   2. supabase/realstack/run.mjs signs real users in with the anon key, then exercises
    #      PostgREST reads, RPC entry points and refused writes under row-level security.
    # Synthetic users only, random passwords never stored, cleaned up at the end.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start the local stack (migrations 0001-0008 applied on start)
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - name: Reset to a clean database from supabase/migrations
        run: supabase db reset
      - name: pgTAP on the real stack
        run: supabase test db supabase/tests/001_tenant_isolation.test.sql supabase/tests/002_roles_and_workflow.test.sql supabase/tests/003_immutability_and_chain.test.sql supabase/tests/004_constraints.test.sql supabase/tests/005_trust_boundaries.test.sql supabase/tests/006_canonical_json.test.sql supabase/tests/007_coverage_and_reproducibility.test.sql supabase/tests/008_workspaces_and_consent.test.sql
      - name: Real JWT / PostgREST / RLS harness
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node supabase/realstack/run.mjs
      - name: DATA-001 repository against the real stack (vitest, skipped without these env vars)
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npx vitest run --root apps/web src/domain/__tests__/supabase-repository.realstack.test.ts
      - if: always()
        run: supabase stop --no-backup
